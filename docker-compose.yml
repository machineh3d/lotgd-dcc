# ============================================================================
# DUNGEON CRAWLER CARL — PRE-BAKED DOCKER COMPOSE STACK
# 1. Copy .env.example to .env and generate real DB_PASS / DB_ROOT_PASS secrets:
#      openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 24
# 2. Launch:
#      docker compose up -d --build
# 3. Open http://<server-ip>:<APP_PORT>/installer.php (DB Host: dcc-db)
# ============================================================================
services:
  dcc-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${LOTGD_BASE_IMAGE:-ghcr.io/nb-core/lotgd:latest}
    container_name: ${WEB_CONTAINER_NAME:-dcc-web}
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      dcc-db:
        condition: service_healthy
    environment:
      TZ: ${TZ:-UTC}
      LOTGD_INSTALL_ENABLED: ${LOTGD_INSTALL_ENABLED:-1}
      MYSQL_HOST: dcc-db
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - dcc_state:/var/lib/lotgd
      - dcc_cache:/var/www/html/cache
      - dcc_config:/var/www/html/config
    networks:
      - dcc-net

  dcc-db:
    image: mariadb:11
    container_name: ${DB_CONTAINER_NAME:-dcc-db}
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:?Set DB_ROOT_PASS in .env}
    volumes:
      - dcc_db_data:/var/lib/mysql
      - ./sql:/opt/lotgd-dcc/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dcc-net

volumes:
  dcc_db_data:
  dcc_state:
  dcc_cache:
  dcc_config:

networks:
  dcc-net:
    driver: bridge
